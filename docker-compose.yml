version: '3.9'

services:
  mongodb:
    image: mongo:7-alpine
    container_name: resume-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: resume_db
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: resume-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/resume_db?authSource=admin
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: your_jwt_secret_key_here
      GOOGLE_API_KEY: your_google_api_key_here
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - /app/node_modules
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: resume-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - resume-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  mongodb_config:

networks:
  resume-network:
    driver: bridge
